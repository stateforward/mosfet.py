[project]
name = "stateforward.bot"
dynamic = ["version"]
description = "Experimental event-driven Python software-robot framework for deterministic, observable realtime bots."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "opentelemetry-api>=1.42.1,<2.0.0",
  "opentelemetry-sdk>=1.42.1,<2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.42.1,<2.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "stateforward-hsm>=1.3.2,<1.4",
  "starlark-go>=1.0.1,<2.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.hatch.version]
path = "src/bot/__init__.py"

[tool.uv.workspace]
members = ["src/providers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples/listen_speak_bot/src"]
markers = [
  "live: hits real external providers (requires API keys; skipped by default in CI without keys)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = [
  "benchmarks",
  "src/bot",
  "tests",
]
extraPaths = ["src", ".", "examples/listen_speak_bot/src"]
pythonVersion = "3.13"
reportImportCycles = false
# Single underscore is private/protected to the declaring class/module. Outside access is an error
# so Python's lack of runtime privacy cannot be used as a back door (reportPrivateUsage).
# Prefer public-only tests so greps do not normalize private reach-in for agents.
reportPrivateUsage = "error"
# The phone firmware unit pins call private guards on unstarted firmware directly, which
# src/bot/devices/phone/phone.py's own docstrings anticipate; their intent requires privates.
executionEnvironments = [{ root = "tests/devices/phone", reportPrivateUsage = "none" }]
