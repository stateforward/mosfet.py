[project]
name = "botbot-tui"
version = "0.1.0"
description = "botbot: the bot that builds the bots, over ACP + the toad TUI widget family."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "textual[syntax]==8.2.7",
  "click==8.4.0",
  "httpx==0.28.1",
  "platformdirs==4.9.6",
  "rich==15.0.0",
  "typeguard==4.5.2",
  "xdg-base-dirs>=6.0.2",
  "typing-extensions==4.15.0",
  "packaging==26.2",
  "stateforward.bot>=0.1.0,<0.2.0",
  "bot-provider-openai-compat>=0.1.0,<0.2.0",
  "bot-provider-typesafe>=0.1.0,<0.2.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botbot"]

[tool.hatch.version]
path = "src/botbot/__init__.py"

[tool.uv.sources]
bot = { path = "../../..", editable = true }
bot-provider-openai-compat = { path = "../../src/providers/openai_compat", editable = true }
bot-provider-typesafe = { path = "../../src/providers/typesafe", editable = true }

[project.scripts]
botbot = "botbot.botbot:main"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.14"
