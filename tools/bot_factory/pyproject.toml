[project]
name = "bot-example-playground-tui"
version = "0.1.0"
description = "The bot's TUI playground: toad widgets + the SMS chat bot, native Textual."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "textual[syntax]==8.2.7",
  "click==8.4.0",
  "httpx==0.28.1",
  "platformdirs==4.9.6",
  "rich==15.0.0",
  "typeguard==4.5.2",
  "xdg-base-dirs>=6.0.2",
  "typing-extensions==4.15.0",
  "packaging==26.2",
  "bashlex==0.18",
  "pathspec==1.1.1",
  "pyperclip==1.11.0",
  "watchdog==6.0.0",
  "psutil==7.2.2",
  "aiosqlite==0.22.1",
  "bot-example-sms-chat-bot",
  "bot-provider-openai-compat",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.uv.sources]
bot-example-sms-chat-bot = { path = "../../sms_chat_bot", editable = true }
bot-provider-openai-compat = { path = "../../../src/providers/openai_compat", editable = true }
