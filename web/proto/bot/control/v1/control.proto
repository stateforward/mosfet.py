syntax = "proto3";

package bot.control.v1;

service Control {
  rpc Subscribe(SubscribeRequest) returns (stream Command);
  rpc Dispatch(Command) returns (DispatchReply);
}

message SubscribeRequest {}

message Command {
  string event_name = 1;
  string data_json = 2;
}

message DispatchReply {
  string result = 1;
  string detail = 2;
}
