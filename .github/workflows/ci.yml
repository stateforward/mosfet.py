name: Package publish readiness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            src/providers/*/pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Check release metadata
        run: uv run --locked python scripts/check_release_version.py

      - name: Root Ruff
        run: uv run --locked ruff check .

      - name: Root Ruff format (changed Python files)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git hash-object -t tree /dev/null)"
            fi
          fi

          changed_python_files=()
          while IFS= read -r -d '' path; do
            changed_python_files+=("$path")
          done < <(git diff --name-only --diff-filter=ACMR -z "$base_sha" "$head_sha" -- '*.py')
          if (( ${#changed_python_files[@]} == 0 )); then
            echo "No changed Python files to format-check."
            exit 0
          fi

          uv run --locked ruff format --check -- "${changed_python_files[@]}"

      - name: Root basedpyright
        run: uv run --locked basedpyright --level error

      - name: Root non-live tests
        run: uv run --locked python -m pytest -q -m 'not live'

      - name: Listen-speak example quality gates
        run: |
          uv run --locked --project examples/listen_speak_bot ruff check \
            examples/listen_speak_bot/src \
            tests/examples/test_listen_speak_bot.py
          uv run --locked --project examples/listen_speak_bot ruff format --check \
            examples/listen_speak_bot/src \
            tests/examples/test_listen_speak_bot.py
          uv run --locked basedpyright --project examples/listen_speak_bot
          uv run --locked python -m pytest -q -m 'not live' tests/examples/test_listen_speak_bot.py

      - name: Minimal example quality gates
        run: |
          uv run --locked --project examples/minimal_bot ruff check examples/minimal_bot/src examples/minimal_bot/tests
          uv run --locked --project examples/minimal_bot ruff format --check \
            examples/minimal_bot/src \
            examples/minimal_bot/tests
          uv run --locked --project examples/minimal_bot basedpyright --project examples/minimal_bot
          uv run --locked --project examples/minimal_bot python -m pytest -q examples/minimal_bot/tests

      - name: Builder example quality gates
        run: |
          uv run --locked --project examples/builder_bot ruff check examples/builder_bot/src examples/builder_bot/tests
          uv run --locked --project examples/builder_bot ruff format --check \
            examples/builder_bot/src \
            examples/builder_bot/tests
          uv run --locked --project examples/builder_bot basedpyright --project examples/builder_bot
          uv run --locked --project examples/builder_bot python -m pytest -q examples/builder_bot/tests

      - name: Ruff
        run: |
          # Provider list derived via glob so new providers are covered automatically.
          uv run --locked ruff check \
            scripts/check_release_version.py \
            src/providers/*/src \
            src/providers/*/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/llama_cpp/vendor/llama-cpp-python/_build/backend.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: Ruff format
        run: |
          # Provider list derived via glob so new providers are covered automatically.
          uv run --locked ruff format --check \
            scripts/check_release_version.py \
            src/providers/*/src \
            src/providers/*/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/llama_cpp/vendor/llama-cpp-python/_build/backend.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: basedpyright
        run: |
          uv run --locked --with basedpyright basedpyright --project basedpyright-private.json
          uv run --locked --with basedpyright basedpyright \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/mosfet/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/llama_cpp/vendor/llama-cpp-python/_build/backend.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py
          # Per-provider typecheck derived via glob so new providers are covered automatically.
          for provider_dir in src/providers/*/; do
            (
              cd "$provider_dir"
              provider="$(basename "$provider_dir")"
              uv run --locked --package "mosfet-provider-$(echo "$provider" | tr '_' '-')" --with basedpyright basedpyright
            )
          done

      - name: Tests
        run: |
          uv run --locked python -m pytest tests/scripts/test_check_release_version.py -q
          uv run --locked python -m pytest tests/test_init.py -q
          # Provider tests derived via glob so new providers are covered automatically.
          for provider_dir in src/providers/*/; do
            provider="$(basename "$provider_dir")"
            uv run --locked --package "mosfet-provider-$(echo "$provider" | tr '_' '-')" python -m pytest "$provider_dir/tests" -q
          done

      - name: Build packages
        run: uv build --all-packages --no-sources

      - name: Build the pinned llama-cpp-python wheel
        # mosfet-provider-llama-cpp pins llama-cpp-python==0.3.36+mosfet.4fbc76de, which no index serves; its build
        # recipe is not a workspace member, so the wheel is built separately for the smoke installs.
        run: uv build --wheel --out-dir dist-native src/providers/llama_cpp/vendor/llama-cpp-python

      - name: Install and import every built wheel in clean environments
        run: scripts/smoke_wheels.sh --find-links dist-native dist

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  container-smoke:
    name: Container smoke (${{ matrix.runner }})
    # One native build per architecture: amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm. The runner's own
    # Docker daemon builds docker/Dockerfile for its architecture, so no emulation or buildx setup is involved.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the minimal_bot image and run the container smoke
        run: scripts/docker_smoke.sh

  web:
    name: Web typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web packages
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
