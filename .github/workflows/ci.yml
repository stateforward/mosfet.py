name: Package publish readiness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            src/providers/*/pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Check release metadata
        run: uv run --locked python scripts/check_release_version.py

      - name: Ruff
        run: |
          uv run --locked ruff check \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/bot/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/livekit/src/bot/providers/livekit \
            src/providers/livekit/tests \
            src/providers/mlx_audio/src/bot/providers/mlx_audio \
            src/providers/mlx_audio/tests \
            src/providers/mlx_vlm/src/bot/providers/mlx_vlm \
            src/providers/mlx_vlm/tests \
            src/providers/postgres_memory/src/bot/providers/postgres_memory \
            src/providers/postgres_memory/tests \
            src/providers/openai_compat/src/bot/providers/openai_compat \
            src/providers/openai_compat/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/sqlite_memory/src/bot/providers/sqlite_memory \
            src/providers/sqlite_memory/tests \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: Ruff format
        run: |
          uv run --locked ruff format --check \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/bot/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/livekit/src/bot/providers/livekit \
            src/providers/livekit/tests \
            src/providers/mlx_audio/src/bot/providers/mlx_audio \
            src/providers/mlx_audio/tests \
            src/providers/mlx_vlm/src/bot/providers/mlx_vlm \
            src/providers/mlx_vlm/tests \
            src/providers/postgres_memory/src/bot/providers/postgres_memory \
            src/providers/postgres_memory/tests \
            src/providers/openai_compat/src/bot/providers/openai_compat \
            src/providers/openai_compat/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/sqlite_memory/src/bot/providers/sqlite_memory \
            src/providers/sqlite_memory/tests \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: basedpyright
        run: |
          uv run --locked --with basedpyright basedpyright --project basedpyright-private.json
          uv run --locked --with basedpyright basedpyright \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/bot/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/sqlite_memory/hatch_build.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py
          (
            cd src/providers/livekit
            uv run --locked --package bot-provider-livekit --with basedpyright basedpyright
          )
          (
            cd src/providers/mlx_audio
            uv run --locked --package bot-provider-mlx-audio --with basedpyright basedpyright
          )
          (
            cd src/providers/mlx_vlm
            uv run --locked --package bot-provider-mlx-vlm --with basedpyright basedpyright
          )
          (
            cd src/providers/postgres_memory
            uv run --locked --package bot-provider-postgres-memory --with basedpyright basedpyright
          )
          (
            cd src/providers/openai_compat
            uv run --locked --package bot-provider-openai-compat --with basedpyright basedpyright
          )
          (
            cd src/providers/sqlite_memory
            uv run --locked --package bot-provider-sqlite-memory --with basedpyright basedpyright
          )

      - name: Tests
        run: |
          uv run --locked python -m pytest tests/scripts/test_check_release_version.py -q
          uv run --locked python -m pytest tests/test_init.py -q
          uv run --locked --package bot-provider-elevenlabs python -m pytest src/providers/elevenlabs/tests -q
          uv run --locked --package bot-provider-livekit python -m pytest src/providers/livekit/tests -q
          uv run --locked --package bot-provider-mlx-audio python -m pytest src/providers/mlx_audio/tests -q
          uv run --locked --package bot-provider-mlx-vlm python -m pytest src/providers/mlx_vlm/tests -q
          uv run --locked --package bot-provider-postgres-memory python -m pytest src/providers/postgres_memory/tests -q
          uv run --locked --package bot-provider-openai-compat python -m pytest src/providers/openai_compat/tests -q
          uv run --locked --package bot-provider-sqlite-memory python -m pytest src/providers/sqlite_memory/tests -q

      - name: Build packages
        run: uv build --all-packages --no-sources

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web packages
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
