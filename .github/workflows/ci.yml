name: Package publish readiness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            src/providers/*/pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Check release metadata
        run: uv run --locked python scripts/check_release_version.py

      - name: Root Ruff
        run: uv run --locked ruff check .

      - name: Root Ruff format (changed Python files)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git hash-object -t tree /dev/null)"
            fi
          fi

          changed_python_files=()
          while IFS= read -r -d '' path; do
            changed_python_files+=("$path")
          done < <(git diff --name-only --diff-filter=ACMR -z "$base_sha" "$head_sha" -- '*.py')
          if (( ${#changed_python_files[@]} == 0 )); then
            echo "No changed Python files to format-check."
            exit 0
          fi

          uv run --locked ruff format --check -- "${changed_python_files[@]}"

      - name: Root basedpyright
        run: uv run --locked basedpyright --level error

      - name: Root non-live tests
        run: uv run --locked python -m pytest -q -m 'not live'

      - name: Listen-speak example quality gates
        run: |
          uv run --locked --project examples/listen_speak_bot ruff check \
            examples/listen_speak_bot/src \
            tests/examples/test_listen_speak_bot.py
          uv run --locked --project examples/listen_speak_bot ruff format --check \
            examples/listen_speak_bot/src \
            tests/examples/test_listen_speak_bot.py
          uv run --locked basedpyright --project examples/listen_speak_bot
          uv run --locked python -m pytest -q -m 'not live' tests/examples/test_listen_speak_bot.py

      - name: Ruff
        run: |
          uv run --locked ruff check \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/bot/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/livekit/src/bot/providers/livekit \
            src/providers/livekit/tests \
            src/providers/mlx_audio/src/bot/providers/mlx_audio \
            src/providers/mlx_audio/tests \
            src/providers/mlx_vlm/src/bot/providers/mlx_vlm \
            src/providers/mlx_vlm/tests \
            src/providers/postgres_memory/src/bot/providers/postgres_memory \
            src/providers/postgres_memory/tests \
            src/providers/openai_compat/src/bot/providers/openai_compat \
            src/providers/openai_compat/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/sqlite_memory/src/bot/providers/sqlite_memory \
            src/providers/sqlite_memory/tests \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: Ruff format
        run: |
          uv run --locked ruff format --check \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/bot/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/livekit/src/bot/providers/livekit \
            src/providers/livekit/tests \
            src/providers/mlx_audio/src/bot/providers/mlx_audio \
            src/providers/mlx_audio/tests \
            src/providers/mlx_vlm/src/bot/providers/mlx_vlm \
            src/providers/mlx_vlm/tests \
            src/providers/postgres_memory/src/bot/providers/postgres_memory \
            src/providers/postgres_memory/tests \
            src/providers/openai_compat/src/bot/providers/openai_compat \
            src/providers/openai_compat/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/sqlite_memory/src/bot/providers/sqlite_memory \
            src/providers/sqlite_memory/tests \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: basedpyright
        run: |
          uv run --locked --with basedpyright basedpyright --project basedpyright-private.json
          uv run --locked --with basedpyright basedpyright \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/bot/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/sqlite_memory/hatch_build.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py
          (
            cd src/providers/livekit
            uv run --locked --package bot-provider-livekit --with basedpyright basedpyright
          )
          (
            cd src/providers/mlx_audio
            uv run --locked --package bot-provider-mlx-audio --with basedpyright basedpyright
          )
          (
            cd src/providers/mlx_vlm
            uv run --locked --package bot-provider-mlx-vlm --with basedpyright basedpyright
          )
          (
            cd src/providers/postgres_memory
            uv run --locked --package bot-provider-postgres-memory --with basedpyright basedpyright
          )
          (
            cd src/providers/openai_compat
            uv run --locked --package bot-provider-openai-compat --with basedpyright basedpyright
          )
          (
            cd src/providers/sqlite_memory
            uv run --locked --package bot-provider-sqlite-memory --with basedpyright basedpyright
          )

      - name: Tests
        run: |
          uv run --locked python -m pytest tests/scripts/test_check_release_version.py -q
          uv run --locked python -m pytest tests/test_init.py -q
          uv run --locked --package bot-provider-elevenlabs python -m pytest src/providers/elevenlabs/tests -q
          uv run --locked --package bot-provider-livekit python -m pytest src/providers/livekit/tests -q
          uv run --locked --package bot-provider-mlx-audio python -m pytest src/providers/mlx_audio/tests -q
          uv run --locked --package bot-provider-mlx-vlm python -m pytest src/providers/mlx_vlm/tests -q
          uv run --locked --package bot-provider-postgres-memory python -m pytest src/providers/postgres_memory/tests -q
          uv run --locked --package bot-provider-openai-compat python -m pytest src/providers/openai_compat/tests -q
          uv run --locked --package bot-provider-sqlite-memory python -m pytest src/providers/sqlite_memory/tests -q

      - name: Build packages
        run: uv build --all-packages --no-sources

      - name: Install and import every built wheel in clean environments
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "No wheels were built."
            exit 1
          fi

          core_wheels=(dist/stateforward_bot-*.whl)
          if (( ${#core_wheels[@]} != 1 )); then
            echo "Expected exactly one stateforward.bot wheel, found ${#core_wheels[@]}."
            exit 1
          fi
          core_wheel="${core_wheels[0]}"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT

          for wheel in "${wheels[@]}"; do
            filename="$(basename "$wheel")"
            case "$filename" in
              stateforward_bot-*.whl) import_name="bot" ;;
              bot_provider_elevenlabs-*.whl) import_name="bot.providers.elevenlabs" ;;
              bot_provider_gemini-*.whl) import_name="bot.providers.gemini" ;;
              bot_provider_livekit-*.whl) import_name="bot.providers.livekit" ;;
              bot_provider_mlx_audio-*.whl) import_name="bot.providers.mlx_audio" ;;
              bot_provider_mlx_vlm-*.whl) import_name="bot.providers.mlx_vlm" ;;
              bot_provider_moonshine-*.whl) import_name="bot.providers.moonshine" ;;
              bot_provider_openai_compat-*.whl) import_name="bot.providers.openai_compat" ;;
              bot_provider_postgres_memory-*.whl) import_name="bot.providers.postgres_memory" ;;
              bot_provider_pyannote-*.whl) import_name="bot.providers.pyannote" ;;
              bot_provider_sqlite_memory-*.whl) import_name="bot.providers.sqlite_memory" ;;
              *)
                echo "No import smoke mapping for built wheel: $filename"
                exit 1
                ;;
            esac

            environment="$smoke_root/${filename%.whl}"
            uv venv --python "$(command -v python)" "$environment"
            python_bin="$environment/bin/python"
            if [[ "$wheel" == "$core_wheel" ]]; then
              uv pip install --python "$python_bin" "$wheel"
            else
              uv pip install --python "$python_bin" "$core_wheel" "$wheel"
            fi
            (
              cd "$environment"
              PYTHONNOUSERSITE=1 PYTHONPATH= SMOKE_IMPORT="$import_name" \
                "$python_bin" -c 'import importlib, os; importlib.import_module(os.environ["SMOKE_IMPORT"])'
            )
          done

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web packages
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
