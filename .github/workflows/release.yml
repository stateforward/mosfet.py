name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            src/providers/*/pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Check release tag
        run: uv run --locked python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Ruff
        run: |
          # Provider list derived via glob so new providers are covered automatically.
          uv run --locked ruff check \
            scripts/check_release_version.py \
            src/providers/*/src \
            src/providers/*/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/llama_cpp/vendor/llama-cpp-python/_build/backend.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: Ruff format
        run: |
          # Provider list derived via glob so new providers are covered automatically.
          uv run --locked ruff format --check \
            scripts/check_release_version.py \
            src/providers/*/src \
            src/providers/*/tests \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/llama_cpp/vendor/llama-cpp-python/_build/backend.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py

      - name: basedpyright
        run: |
          uv run --locked --with basedpyright basedpyright --project basedpyright-private.json
          uv run --locked --with basedpyright basedpyright \
            scripts/check_release_version.py \
            src/providers/elevenlabs/src/mosfet/providers/elevenlabs/__init__.py \
            src/providers/elevenlabs/tests/test_package_metadata.py \
            src/providers/sqlite_memory/hatch_build.py \
            src/providers/llama_cpp/vendor/llama-cpp-python/_build/backend.py \
            tests/scripts/test_check_release_version.py \
            tests/test_init.py
          # Per-provider typecheck derived via glob so new providers are covered automatically.
          for provider_dir in src/providers/*/; do
            (
              cd "$provider_dir"
              provider="$(basename "$provider_dir")"
              uv run --locked --package "mosfet-provider-$(echo "$provider" | tr '_' '-')" --with basedpyright basedpyright
            )
          done

      - name: Tests
        run: |
          uv run --locked python -m pytest tests/scripts/test_check_release_version.py -q
          uv run --locked python -m pytest tests/test_init.py -q
          # Provider tests derived via glob so new providers are covered automatically.
          for provider_dir in src/providers/*/; do
            provider="$(basename "$provider_dir")"
            uv run --locked --package "mosfet-provider-$(echo "$provider" | tr '_' '-')" python -m pytest "$provider_dir/tests" -q
          done

      - name: Build packages
        run: uv build --all-packages --no-sources

      - name: Exclude packages that cannot be published
        # mosfet-provider-llama-cpp pins llama-cpp-python==0.3.36+mosfet.4fbc76de, a local build no index serves.
        # It stays out of every release until an upstream llama-cpp-python release replaces the pinned build.
        run: |
          shopt -s nullglob
          excluded=(dist/mosfet_provider_llama_cpp-*)
          if (( ${#excluded[@]} != 2 )); then
            echo "Expected the mosfet-provider-llama-cpp wheel and sdist in dist, found: ${excluded[*]}" >&2
            exit 1
          fi
          rm -- "${excluded[@]}"

      - name: Publish packages
        run: uv publish --trusted-publishing always

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
