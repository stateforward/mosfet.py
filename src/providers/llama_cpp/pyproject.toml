[project]
name = "mosfet-provider-llama-cpp"
dynamic = ["version"]
description = "In-process llama.cpp provider package for stateforward.mosfet, on a pinned llama-cpp-python build."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "llama-cpp-python==0.3.36+mosfet.4fbc76de; sys_platform == 'darwin' or sys_platform == 'linux'",
  "stateforward.mosfet",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet"]
exclude = ["src/mosfet/__init__.pyi"]

[tool.hatch.version]
path = "src/mosfet/providers/llama_cpp/__init__.py"

[tool.uv.sources]
llama-cpp-python = { path = "vendor/llama-cpp-python", editable = false }
stateforward-mosfet = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["vendor/llama-cpp-python/_build"]
markers = [
  "live: loads the installed native llama.cpp build",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests", "vendor/llama-cpp-python/_build"]
extraPaths = ["src", "../../../src", "../../..", "vendor/llama-cpp-python/_build"]
pythonVersion = "3.13"
reportPrivateUsage = "error"
