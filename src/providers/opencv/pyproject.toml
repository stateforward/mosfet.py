[project]
name = "mosfet-provider-opencv"
dynamic = ["version"]
description = "OpenCV face, object and cheap change-measure provider package for stateforward.mosfet vision."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.4,<3",
  "opencv-python==4.13.0.92",
  "stateforward.mosfet",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet"]
exclude = ["src/mosfet/__init__.pyi"]

[tool.hatch.version]
path = "src/mosfet/providers/opencv/__init__.py"

[tool.uv.sources]
stateforward-mosfet = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
reportPrivateUsage = "error"
