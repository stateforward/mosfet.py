[project]
name = "bot-provider-openai-compat"
dynamic = ["version"]
description = "OpenAI-compatible text generation and processing provider package for stateforward.bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "openai>=2.11.0,<3.0.0",
  "stateforward.bot>=0.1.0,<0.2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
exclude = ["src/bot/__init__.pyi"]

[tool.hatch.version]
path = "src/bot/providers/openai_compat/__init__.py"

[tool.uv.sources]
stateforward-bot = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
