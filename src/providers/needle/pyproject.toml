[project]
name = "mosfet-provider-needle"
dynamic = ["version"]
description = "Cactus Compute Needle 3 local tool-calling provider for the Intuition reflex tier of stateforward.mosfet."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cactus-needle>=3.0.2,<4.0.0",
  "stateforward.mosfet>=0.1.0,<0.2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

exclude = ["src/mosfet/__init__.pyi"]

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet"]

[tool.hatch.version]
path = "src/mosfet/providers/needle/__init__.py"

[tool.uv.sources]
stateforward-mosfet = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: loads the real Needle 3 engine and weights (requires cactus-needle plus a cached or downloadable model; skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.basedpyright]
reportImportCycles = false
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../..", "src/mosfet/providers/needle"]
pythonVersion = "3.13"
