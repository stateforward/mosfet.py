[project]
name = "bot-provider-mlx-audio"
dynamic = ["version"]
description = "MLX Audio voice provider package for stateforward.bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mlx-audio>=0.4.4,<0.5.0; sys_platform == 'darwin'",
  "stateforward.bot",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
exclude = ["src/bot/__init__.pyi"]

[tool.hatch.version]
path = "src/bot/providers/mlx_audio/__init__.py"

[tool.uv.sources]
stateforward-bot = { workspace = true }


[tool.pytest.ini_options]
testpaths = ["tests"]
# test_speech_decoder and test_speech_encoder import the shared root `tests` package
# (HSM state helpers), so the repo root has to be importable from this rootdir.
pythonpath = ["../../.."]
markers = [
  "live: runs the real MLX Audio model (downloads weights on first use; skipped by default in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
reportPrivateUsage = "error"
