[project]
name = "mosfet-provider-speech-server"
dynamic = ["version"]
description = "Speech-server diarization and voice-embedding clients for stateforward.mosfet hearing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "stateforward.mosfet",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet"]
exclude = ["src/mosfet/__init__.pyi"]

[tool.hatch.version]
path = "src/mosfet/providers/speech_server/__init__.py"

[tool.uv.sources]
stateforward-mosfet = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits served speech-server endpoints named by BOT_SPEECH_SERVER_URL (skipped by default)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
reportImportCycles = false
reportPrivateUsage = "error"
