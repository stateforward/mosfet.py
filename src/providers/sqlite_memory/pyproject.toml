[project]
name = "mosfet-provider-sqlite-memory"
dynamic = ["version"]
description = "Turnkey SQLite memory provider package for stateforward.mosfet."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "stateforward.mosfet",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
  "sqlite-vec>=0.1.10a4,<0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet"]
exclude = ["src/mosfet/__init__.pyi"]
artifacts = ["src/mosfet/providers/sqlite_memory/_native/*"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/sqlite-objstore/LICENSE" = "bot/providers/sqlite_memory/_licenses/sqlite-objstore-LICENSE"
"vendor/sqlite-objstore/THIRD_PARTY_NOTICES.md" = "bot/providers/sqlite_memory/_licenses/sqlite-objstore-THIRD_PARTY_NOTICES.md"
"vendor/sqlite-objstore/third_party/blake3/LICENSE_A2" = "bot/providers/sqlite_memory/_licenses/blake3-LICENSE_A2"
"vendor/sqlite-objstore/third_party/blake3/LICENSE_A2LLVM" = "bot/providers/sqlite_memory/_licenses/blake3-LICENSE_A2LLVM"
"vendor/sqlite-objstore/third_party/blake3/LICENSE_CC0" = "bot/providers/sqlite_memory/_licenses/blake3-LICENSE_CC0"
"vendor/sqlite-vec/LICENSE-MIT" = "bot/providers/sqlite_memory/_licenses/sqlite-vec-LICENSE-MIT"
"vendor/sqlite-vec/LICENSE-APACHE" = "bot/providers/sqlite_memory/_licenses/sqlite-vec-LICENSE-APACHE"
"vendor/sqlite-vec/THIRD_PARTY_NOTICES.md" = "bot/providers/sqlite_memory/_licenses/sqlite-vec-THIRD_PARTY_NOTICES.md"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
dependencies = ["sqlite-vec>=0.1.10a4,<0.2.0"]

[tool.hatch.version]
path = "src/mosfet/providers/sqlite_memory/__init__.py"

[tool.uv.sources]
stateforward-mosfet = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
reportPrivateUsage = "error"
