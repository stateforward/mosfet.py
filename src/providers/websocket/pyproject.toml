[project]
name = "mosfet-provider-websocket"
dynamic = ["version"]
description = "Yamux-over-WebSocket transport provider package for stateforward.mosfet."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "websockets>=16.0,<17",
  "stateforward.mosfet",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosfet"]
exclude = ["src/mosfet/__init__.pyi"]

[tool.hatch.version]
path = "src/mosfet/providers/websocket/__init__.py"

[tool.uv.sources]
stateforward-mosfet = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the shared root `tests` package (socket and browser fakes, computer remote
# doubles, the metric reader), so the repo root has to be importable from this rootdir.
pythonpath = ["../../.."]
markers = [
  "integration: real sockets on the loopback interface (no external network)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
reportPrivateUsage = "error"
# Package `__init__` re-exports from sibling modules that import each other's events.
reportImportCycles = false
