[project]
name = "bot-provider-livekit"
dynamic = ["version"]
description = "LiveKit real-time media provider package for stateforward.bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "livekit>=1.1.10,<2.0.0",
  "stateforward.bot",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
exclude = ["src/bot/__init__.pyi"]

[tool.hatch.version]
path = "src/bot/providers/livekit/__init__.py"

[tool.uv.sources]
stateforward-bot = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "../../../src", "../../.."]
pythonVersion = "3.13"
reportPrivateUsage = "error"
# Package `__init__` re-exports from `.phone`, which imports sibling modules — an intrinsic
# package-init cycle. The root project disables this check for the same reason.
reportImportCycles = false
executionEnvironments = [{ root = "tests/test_phone.py", reportPrivateUsage = "none" }]
