[project]
name = "bot-example-listen-speak-bot"
version = "0.1.0"
description = "Device-free listen→speak stateforward.bot example with Gemini cognition (macOS say)."
requires-python = ">=3.13"
dependencies = [
  "stateforward.bot",
  "bot-provider-gemini",
]

[project.scripts]
listen-speak-bot = "listen_speak_bot_example:main"
listen-speak-bot-example = "listen_speak_bot_example:main"

[tool.uv.sources]
stateforward-bot = { path = "../..", editable = true }
bot-provider-gemini = { path = "../../src/providers/gemini", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listen_speak_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src"]
extraPaths = ["src", "../../src/providers/gemini/src", "../../src"]
pythonVersion = "3.13"
reportMissingModuleSource = "none"
