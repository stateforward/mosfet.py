[project]
name = "bot-example-listen-speak-bot"
version = "0.1.0"
description = "Device-free listen→speak stateforward.mosfet example with Mercury 2 intuition + Gemini reasoning (macOS say)."
requires-python = ">=3.13"
dependencies = [
  "stateforward.mosfet",
  "mosfet-provider-gemini",
  "mosfet-provider-mlx-audio",
  "mosfet-provider-openai-compat",
  "mosfet-provider-pyannote",
]

[project.scripts]
listen-speak-bot = "listen_speak_bot_example:main"
listen-speak-bot-example = "listen_speak_bot_example:main"

[tool.uv.sources]
stateforward-mosfet = { path = "../..", editable = true }
mosfet-provider-gemini = { path = "../../src/providers/gemini", editable = true }
mosfet-provider-mlx-audio = { path = "../../src/providers/mlx_audio", editable = true }
mosfet-provider-openai-compat = { path = "../../src/providers/openai_compat", editable = true }
mosfet-provider-pyannote = { path = "../../src/providers/pyannote", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listen_speak_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src", "../../src"]

[tool.basedpyright]
include = ["src"]
extraPaths = [
  "src",
  "../../src",
  "../..",
]
pythonVersion = "3.13"
reportMissingModuleSource = "none"
reportPrivateUsage = "error"
