[project]
name = "builder-bot-example"
version = "0.1.0"
description = "A single-user builder bot reached through a computer, and a terminal for that computer's far side."
requires-python = ">=3.13"
dependencies = [
  "stateforward.mosfet",
  "mosfet-provider-openai-compat",
  "mosfet-provider-websocket",
  "mosfet-provider-docker",
]

[project.scripts]
builder-terminal = "builder_bot_example.terminal:main"

[tool.uv.sources]
stateforward-mosfet = { path = "../..", editable = true }
mosfet-provider-openai-compat = { path = "../../src/providers/openai_compat", editable = true }
mosfet-provider-websocket = { path = "../../src/providers/websocket", editable = true }
mosfet-provider-docker = { path = "../../src/providers/docker", editable = true }

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/builder_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportPrivateUsage = "error"
