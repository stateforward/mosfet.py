[project]
name = "bot-example-sms-chat-bot"
version = "0.1.0"
description = "SMS exchange example: an SMS phone device and a text reply bot."
requires-python = ">=3.13"
dependencies = [
  "stateforward.bot",
]

[project.scripts]
sms-chat-bot = "sms_chat_bot_example:main"
sms-chat-bot-example = "sms_chat_bot_example:main"

[tool.uv.sources]
stateforward-bot = { path = "../..", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sms_chat_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src", "../../src"]

[tool.basedpyright]
include = ["src"]
extraPaths = [
  "src",
  "../../src",
  "../..",
]
pythonVersion = "3.13"
