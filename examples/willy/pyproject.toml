[project]
name = "willy-example"
version = "0.1.0"
description = "Willy: one bot for the whole house, reached through a computer in each room, that learns who people are."
requires-python = ">=3.13"
dependencies = [
  "stateforward.mosfet",
  "mosfet-provider-openai-compat",
  "mosfet-provider-opencv",
  "mosfet-provider-speech-server",
  "mosfet-provider-sqlite-memory",
  "mosfet-provider-websocket",
  "sounddevice==0.5.5",
]

[tool.uv.sources]
stateforward-mosfet = { path = "../..", editable = true }
mosfet-provider-openai-compat = { path = "../../src/providers/openai_compat", editable = true }
mosfet-provider-opencv = { path = "../../src/providers/opencv", editable = true }
mosfet-provider-speech-server = { path = "../../src/providers/speech_server", editable = true }
mosfet-provider-sqlite-memory = { path = "../../src/providers/sqlite_memory", editable = true }
mosfet-provider-websocket = { path = "../../src/providers/websocket", editable = true }

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/willy_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: runs Willy against the lab model server (CT 108); also needs WILLY_LIVE=1, so skipped by default",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportPrivateUsage = "error"
