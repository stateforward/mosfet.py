[project]
name = "bot-example-minimal-bot"
version = "0.1.0"
description = "The smallest stateforward.mosfet bot: one device-free bot, run with `python -m minimal_bot_example`."
requires-python = ">=3.13"
dependencies = [
  "stateforward.mosfet",
  "mosfet-provider-openai-compat",
  "mosfet-provider-decision",
]

[tool.uv.sources]
stateforward-mosfet = { path = "../..", editable = true }
mosfet-provider-openai-compat = { path = "../../src/providers/openai_compat", editable = true }
mosfet-provider-decision = { path = "../../src/providers/decision", editable = true }

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportPrivateUsage = "error"
