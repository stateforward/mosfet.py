[project]
name = "bot-example-phone-bot"
version = "0.1.0"
description = "Phone-capable stateforward.bot bots backed by LiveKit and Gemini."
requires-python = ">=3.13"
dependencies = [
  "stateforward.bot",
  "bot-provider-gemini",
  "bot-provider-livekit",
  "bot-provider-sqlite-memory",
]

[project.scripts]
phone-bot = "phone_bot_example.cli:main"
phone-bot-example = "phone_bot_example:main"
mint-livekit-token = "phone_bot_example.token_cli:main"

[tool.uv.sources]
stateforward-bot = { path = "../..", editable = true }
bot-provider-gemini = { path = "../../src/providers/gemini", editable = true }
bot-provider-livekit = { path = "../../src/providers/livekit", editable = true }
bot-provider-sqlite-memory = { path = "../../src/providers/sqlite_memory", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src"]
extraPaths = ["src", "../../src/providers/gemini/src", "../../src/providers/livekit/src", "../../src/providers/sqlite_memory/src", "../../src"]
pythonVersion = "3.13"
reportMissingModuleSource = "none"
reportPrivateUsage = "error"
