[project]
name = "bot-example-phone-bot"
version = "0.1.0"
description = "A stateforward.mosfet phone bot, one bot.define: a LiveKit line, Silero VAD, pyannote voice identity, an OpenAI reasoning model, and Gemini STT/TTS."
requires-python = ">=3.13"
dependencies = [
  "stateforward.mosfet",
  "mosfet-provider-openai-compat",
  "mosfet-provider-livekit",
  "mosfet-provider-sqlite-memory",
  "mosfet-provider-decision",
  "mosfet-provider-gemini",
  "mosfet-provider-mlx-audio",
  "mosfet-provider-pyannote",
]

[project.scripts]
mint-livekit-token = "phone_bot_example.token_cli:main"

[tool.uv.sources]
mosfet-provider-decision = { path = "../../src/providers/decision", editable = true }
stateforward-mosfet = { path = "../..", editable = true }
mosfet-provider-openai-compat = { path = "../../src/providers/openai_compat", editable = true }
mosfet-provider-livekit = { path = "../../src/providers/livekit", editable = true }
mosfet-provider-sqlite-memory = { path = "../../src/providers/sqlite_memory", editable = true }
mosfet-provider-gemini = { path = "../../src/providers/gemini", editable = true }
mosfet-provider-mlx-audio = { path = "../../src/providers/mlx_audio", editable = true }
mosfet-provider-pyannote = { path = "../../src/providers/pyannote", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0.0",
  "ruff~=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_bot_example"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.basedpyright]
include = ["src"]
extraPaths = [
  "src",
  "../../src",
]
pythonVersion = "3.13"
reportMissingModuleSource = "none"
reportPrivateUsage = "error"
